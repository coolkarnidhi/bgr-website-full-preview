<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { view: 'year', year: 0, type: 0 };
  componentDidMount() {
    const host = document.getElementById('bgr-quote');
    if (!host || host.dataset.loaded) return;
    host.dataset.loaded = '1';
    host.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'tradingview-widget-container';
    const w = document.createElement('div'); w.className = 'tradingview-widget-container__widget'; wrap.appendChild(w);
    const s = document.createElement('script');
    s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js';
    s.async = true;
    s.text = JSON.stringify({ symbol: 'BSE:BGRENERGY', width: '100%', colorTheme: 'light', isTransparent: true, locale: 'en' });
    wrap.appendChild(s); host.appendChild(wrap);
    const link = document.createElement('a');
    link.className = 'tvl'; link.href = 'https://www.tradingview.com/symbols/BSE-BGRENERGY/';
    link.target = '_blank'; link.rel = 'noopener'; link.setAttribute('aria-label', 'View BGR Energy Systems share chart on TradingView');
    host.appendChild(link);
  }
  renderVals() {
    const years = Array.from({ length: 21 }, (_, i) => { const y = 2025 - i; return 'FY ' + y + '-' + String((y + 1) % 100).padStart(2, '0'); });
    const types = [
      { label: 'Annual reports', docs: fy => ['Annual report, ' + fy] },
      { label: 'Quarterly results', docs: fy => ['Q1', 'Q2', 'Q3', 'Q4'].map(q => q + ' results, ' + fy) },
      { label: 'Shareholding pattern', docs: fy => ['Q1', 'Q2', 'Q3', 'Q4'].map(q => 'Shareholding pattern, ' + q + ' ' + fy) },
      { label: 'AGM Documentation', docs: fy => ['AGM notice, ' + fy, 'Chairperson presentation, ' + fy, 'AGM transcript, ' + fy] },
      { label: 'Corporate governance reports', docs: fy => ['Corporate governance report, ' + fy] },
      { label: 'Stock exchange intimations', docs: fy => ['Stock exchange intimations, ' + fy] }
    ];
    const n = (c) => c + (c === 1 ? ' document' : ' documents');
    const byYear = this.state.view === 'year';
    let navItems, groups, heading;
    if (byYear) {
      navItems = years.map((fy, i) => ({ label: fy, count: types.reduce((a, t) => a + t.docs(fy).length, 0), active: i === this.state.year, inactive: i !== this.state.year, onClick: () => this.setState({ year: i }) }));
      const fy = years[this.state.year];
      heading = fy;
      groups = types.map(t => { const d = t.docs(fy); return { label: t.label, countLabel: n(d.length), docs: d.map(title => ({ title })) }; });
    } else {
      navItems = types.map((t, i) => ({ label: t.label, count: years.reduce((a, fy) => a + t.docs(fy).length, 0), active: i === this.state.type, inactive: i !== this.state.type, onClick: () => this.setState({ type: i }) }));
      const t = types[this.state.type];
      heading = t.label;
      groups = years.map(fy => { const d = t.docs(fy); return { label: fy, countLabel: n(d.length), docs: d.map(title => ({ title })) }; });
    }
    const total = years.reduce((a, fy) => a + types.reduce((b, t) => b + t.docs(fy).length, 0), 0);
    return {
      isYear: byYear, isType: !byYear,
      showYear: () => this.setState({ view: 'year' }), showType: () => this.setState({ view: 'type' }),
      navLabel: byYear ? 'Financial year' : 'File type',
      navItems, groups, heading,
      summary: 'Historical filings, ~850 documents across ~21 financial years. Migration in progress.'
    };
  }
}
</script>
